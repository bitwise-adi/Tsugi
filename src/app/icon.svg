<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f17"/>
      <stop offset="50%" stop-color="#141522"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>

    <!-- Subtle Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Golden Kintsugi Seam Gradient -->
    <linearGradient id="goldKintsugi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Violet / Purple Accent Gradient -->
    <linearGradient id="violetAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambientLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Ambient Internal Lighting -->
  <circle cx="160" cy="160" r="100" fill="#f59e0b" opacity="0.12" filter="url(#ambientLight)"/>
  <circle cx="340" cy="340" r="120" fill="#8b5cf6" opacity="0.18" filter="url(#ambientLight)"/>

  <!-- Kintsugi Golden Crack / Seam flowing through the background -->
  <path d="M 60 110 Q 140 180, 190 170 T 260 256 T 330 330 Q 390 350, 450 410" 
        fill="none" 
        stroke="url(#goldKintsugi)" 
        stroke-width="5" 
        stroke-linecap="round" 
        opacity="0.35" 
        filter="url(#goldGlow)"/>

  <!-- Brand Mark: `(t)` -->
  <g filter="url(#goldGlow)">
    <!-- Left Parenthesis `(` -->
    <path d="M 172 170 C 130 215, 130 297, 172 342" 
          fill="none" 
          stroke="url(#goldKintsugi)" 
          stroke-width="36" 
          stroke-linecap="round"/>

    <!-- Center Letter `t` -->
    <!-- Horizontal Crossbar -->
    <rect x="212" y="210" width="88" height="30" rx="15" fill="url(#violetAccent)"/>
    <!-- Vertical Stem with J-curve bottom -->
    <path d="M 248 160 L 248 308 C 248 332, 264 344, 290 342" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="34" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right Parenthesis `)` -->
    <path d="M 340 170 C 382 215, 382 297, 340 342" 
          fill="none" 
          stroke="url(#goldKintsugi)" 
          stroke-width="36" 
          stroke-linecap="round"/>
  </g>

  <!-- Golden Seam Joint Highlight Sparkle -->
  <circle cx="248" cy="225" r="8" fill="#fffbeb" filter="url(#goldGlow)"/>
  <circle cx="248" cy="225" r="4" fill="#fbbf24"/>
</svg>
